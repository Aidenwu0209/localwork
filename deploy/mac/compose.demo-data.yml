# Isolated P3.4 recording data layer. It uses the normal localhost ports while
# keeping the user's regular DejaView volumes untouched.
name: dejaview-p34-data

services:
  database:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=dejaview
      - POSTGRES_PASSWORD=dejaview
      - POSTGRES_DB=dejaview_demo
      - TZ=Asia/Shanghai
      - PGTZ=Asia/Shanghai
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - ./timeline-init.sql:/docker-entrypoint-initdb.d/timeline-init.sql:ro
      - dejaview-p34-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dejaview -d dejaview_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - dejaview-p34-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dejaview-p34-pgdata:
  dejaview-p34-redis:
