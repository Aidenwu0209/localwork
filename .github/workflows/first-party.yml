name: first-party

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Apply and verify the pinned Honcho patch stack
        run: make setup
      - name: Run the same offline first-party suite used locally
        run: make test
      - name: Validate the exact public submission bundle
        run: make submission-check

  macos-capture:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run the macOS permission and capture contract
        run: make test-capture
